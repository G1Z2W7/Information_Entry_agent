<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>位置解析 Agent 联调页</title>
    <style>
      :root {
        --bg: #f4efe5;
        --panel: rgba(255, 252, 247, 0.92);
        --ink: #1f2b34;
        --muted: #65727c;
        --line: #ddd2c2;
        --accent: #0f766e;
        --accent-soft: #dff6f1;
        --warn: #9a3412;
        --shadow: 0 24px 48px rgba(31, 43, 52, 0.1);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top right, rgba(15, 118, 110, 0.16), transparent 24%),
          linear-gradient(180deg, #faf5ec 0%, var(--bg) 100%);
        color: var(--ink);
        font-family: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      }
      .page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 18px 40px;
      }
      .shell {
        background: var(--panel);
        border: 1px solid rgba(221, 210, 194, 0.92);
        border-radius: 26px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(14px);
      }
      .header {
        padding: 24px 26px 18px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
      }
      .title {
        margin: 0;
        font-size: 30px;
        letter-spacing: -0.04em;
      }
      .subtitle {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
        max-width: 720px;
      }
      .env-pill {
        align-self: flex-start;
        padding: 10px 14px;
        border-radius: 999px;
        background: #ecf8f6;
        color: #115e59;
        font-size: 13px;
      }
      .body {
        display: grid;
        grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
        min-height: 760px;
      }
      .sidebar {
        border-right: 1px solid var(--line);
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .panel {
        border: 1px solid #e6dccd;
        border-radius: 18px;
        background: #fffdf9;
        padding: 16px;
      }
      .panel h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 12px;
      }
      .field label {
        font-size: 13px;
        font-weight: 600;
      }
      .field input, .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        background: #fff;
        color: var(--ink);
      }
      .field textarea {
        min-height: 92px;
        resize: vertical;
      }
      .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: transform 120ms ease, opacity 120ms ease;
      }
      button:hover { transform: translateY(-1px); }
      button.primary {
        background: var(--accent);
        color: #fff;
      }
      button.secondary {
        background: #e6ddd0;
        color: var(--ink);
      }
      .results {
        padding: 22px;
        display: grid;
        grid-template-rows: 420px minmax(0, 1fr);
        gap: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
      }
      #map {
        width: 100%;
        height: 100%;
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid #d7cec0;
        background:
          linear-gradient(135deg, rgba(15,118,110,0.12), rgba(15,118,110,0.02)),
          #f8f6f1;
      }
      .result-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 18px;
        min-height: 0;
      }
      .list, .json {
        min-height: 0;
      }
      .candidate-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 260px;
        overflow: auto;
      }
      .candidate {
        border: 1px solid #e5dbcc;
        border-radius: 14px;
        padding: 12px;
        background: #fff;
      }
      .candidate strong {
        display: block;
        font-size: 14px;
      }
      .candidate span {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        line-height: 1.55;
        max-height: 260px;
        overflow: auto;
      }
      .status {
        margin-top: 10px;
        font-size: 13px;
        color: var(--warn);
      }
      @media (max-width: 980px) {
        .body { grid-template-columns: 1fr; }
        .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
        .results { grid-template-rows: 300px auto; }
        .result-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="shell">
        <div class="header">
          <div>
            <h1 class="title">位置解析 Agent 联调页</h1>
            <p class="subtitle">
              这个页面只联调独立位置 Agent，不经过主经销商 Agent。支持获取当前位置、附近候选、文本搜索和完整 resolve 流程。
            </p>
          </div>
          <div class="env-pill" id="envStatus">等待加载高德配置</div>
        </div>

        <div class="body">
          <aside class="sidebar">
            <section class="panel">
              <h2>当前位置</h2>
              <p class="hint">浏览器定位拿到经纬度后，调用 `/api/location-agent/nearby` 获取附近候选。</p>
              <div class="button-row">
                <button class="primary" id="locateButton">获取当前位置</button>
              </div>
              <div class="status" id="coordsStatus">尚未获取坐标。</div>
            </section>

            <section class="panel">
              <h2>地址搜索</h2>
              <div class="field">
                <label for="queryInput">搜索关键词</label>
                <input id="queryInput" placeholder="例如：张江路88号" />
              </div>
              <div class="field">
                <label for="cityHintInput">城市提示</label>
                <input id="cityHintInput" placeholder="例如：上海市" />
              </div>
              <div class="button-row">
                <button class="secondary" id="searchButton">调用搜索接口</button>
              </div>
            </section>

            <section class="panel">
              <h2>完整 Resolve</h2>
              <p class="hint">把用户原话和当前位置一起交给独立位置 Agent，查看当前状态机返回。</p>
              <div class="field">
                <label for="messageInput">用户原话</label>
                <textarea id="messageInput" placeholder="例如：浙江省杭州市西湖区文三路18号"></textarea>
              </div>
              <div class="button-row">
                <button class="primary" id="resolveButton">调用位置 Agent</button>
              </div>
            </section>
          </aside>

          <section class="results">
            <div id="map"></div>
            <div class="result-grid">
              <section class="panel list">
                <h2>候选列表</h2>
                <div class="candidate-list" id="candidateList"></div>
              </section>
              <section class="panel json">
                <h2>接口返回</h2>
                <pre id="jsonOutput">{}</pre>
              </section>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script>
      const envStatus = document.getElementById("envStatus");
      const coordsStatus = document.getElementById("coordsStatus");
      const candidateList = document.getElementById("candidateList");
      const jsonOutput = document.getElementById("jsonOutput");
      const queryInput = document.getElementById("queryInput");
      const cityHintInput = document.getElementById("cityHintInput");
      const messageInput = document.getElementById("messageInput");
      const locateButton = document.getElementById("locateButton");
      const searchButton = document.getElementById("searchButton");
      const resolveButton = document.getElementById("resolveButton");

      let currentCoordinates = null;
      let map = null;
      let markerLayer = [];

      boot().catch((error) => {
        envStatus.textContent = error.message || "加载页面失败";
      });

      async function boot() {
        const config = await fetchJson("/api/location-agent/config");
        envStatus.textContent = config.web_service_enabled
          ? "高德 Key 已加载"
          : "未检测到可用的高德 Key";

        if (config.js_api_key) {
          await loadAmap(config.js_api_key);
          map = new AMap.Map("map", {
            zoom: 12,
            center: [120.1551, 30.2741],
            mapStyle: "amap://styles/whitesmoke"
          });
        } else {
          document.getElementById("map").innerHTML = "<div style='padding:16px;color:#65727c'>未配置 AMAP_JS_API_KEY，无法显示地图。</div>";
        }

        locateButton.addEventListener("click", handleLocate);
        searchButton.addEventListener("click", handleSearch);
        resolveButton.addEventListener("click", handleResolve);
      }

      async function handleLocate() {
        if (!navigator.geolocation) {
          coordsStatus.textContent = "当前浏览器不支持定位。";
          return;
        }

        coordsStatus.textContent = "正在获取浏览器定位...";
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            currentCoordinates = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy_meters: position.coords.accuracy
            };
            coordsStatus.textContent = `已获取坐标：${currentCoordinates.latitude.toFixed(6)}, ${currentCoordinates.longitude.toFixed(6)}`;
            const payload = await fetchJson("/api/location-agent/nearby", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(currentCoordinates)
            });
            renderResult(payload);
          },
          (error) => {
            coordsStatus.textContent = `定位失败：${error.message}`;
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }

      async function handleSearch() {
        const payload = await fetchJson("/api/location-agent/search", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query: queryInput.value.trim(),
            city_hint: cityHintInput.value.trim() || null
          })
        });
        renderResult(payload);
      }

      async function handleResolve() {
        const payload = await fetchJson("/api/location-agent/resolve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            session_id: "playground-location-agent",
            user_message: messageInput.value.trim(),
            current_coordinates: currentCoordinates
          })
        });
        renderResult(payload);
      }

      function renderResult(payload) {
        jsonOutput.textContent = JSON.stringify(payload, null, 2);
        const candidates = payload.candidates || [];
        candidateList.innerHTML = "";
        candidates.forEach((candidate) => {
          const item = document.createElement("div");
          item.className = "candidate";
          item.innerHTML = `<strong>${candidate.full_address || candidate.label}</strong><span>${candidate.candidate_id}</span>`;
          candidateList.appendChild(item);
        });

        const mapPoints = [];
        if (payload.resolved_address && payload.resolved_address.longitude && payload.resolved_address.latitude) {
          mapPoints.push(payload.resolved_address);
        }
        candidates.forEach((candidate) => {
          if (candidate.longitude && candidate.latitude) {
            mapPoints.push(candidate);
          }
        });
        updateMap(mapPoints);
      }

      function updateMap(points) {
        if (!map || !window.AMap) {
          return;
        }
        if (markerLayer.length) {
          map.remove(markerLayer);
          markerLayer = [];
        }

        points.forEach((point) => {
          const marker = new AMap.Marker({
            position: [point.longitude, point.latitude],
            title: point.full_address || point.label
          });
          markerLayer.push(marker);
        });

        if (markerLayer.length) {
          map.add(markerLayer);
          map.setFitView(markerLayer, false, [40, 40, 40, 40]);
        }
      }

      async function fetchJson(url, options) {
        const response = await fetch(url, options);
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || `请求失败：${response.status}`);
        }
        return payload;
      }

      function loadAmap(apiKey) {
        return new Promise((resolve, reject) => {
          if (window.AMap) {
            resolve();
            return;
          }
          const script = document.createElement("script");
          script.src = `https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(apiKey)}`;
          script.async = true;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error("高德 JS API 加载失败"));
          document.head.appendChild(script);
        });
      }
    </script>
  </body>
</html>
