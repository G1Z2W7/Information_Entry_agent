<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>经销商 Agent 联调页</title>
<style>
:root {
  --bg: #f7f9fc;
  --panel: #ffffff;
  --ink: #1d2a36;
  --muted: #66727d;
  --line: #dde6f7;
  --brand: #246bff;
  --brand-soft: #eef4ff;
  --accent: #b8562a;
  --accent-soft: #f3e1d7;
  --user: #1d2a36;
  --agent-bg: #ffffff;
  --shadow: 0 10px 24px rgba(17,24,39,0.06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at top right, rgba(36,107,255,0.08), transparent 24%),
    linear-gradient(180deg, #eff4ff 0%, var(--bg) 38%, #f7f9fc 100%);
  color: var(--ink);
  font-family: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
  padding: 20px;
}

/* ===== Phone Shell ===== */
.phone-shell {
  width: 390px;
  max-width: 100vw;
  height: min(844px, calc(100vh - 40px));
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: 40px;
  border: 3px solid #1d2a36;
  box-shadow:
    0 0 0 2px #e0e0e0,
    0 20px 60px rgba(0,0,0,0.15);
  overflow: hidden;
  position: relative;
}
/* notch */
.phone-shell::before {
  content: "";
  display: block;
  width: 120px;
  height: 30px;
  background: #1d2a36;
  border-radius: 0 0 20px 20px;
  margin: 0 auto;
  flex-shrink: 0;
}

/* ===== Welcome Hero ===== */
.welcome-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 60px 20px 40px;
  text-align: center;
}
.welcome-hero-icon { font-size: 56px; margin-bottom: 16px; }
.welcome-hero-title { font-size: 28px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.03em; }
.welcome-hero-subtitle { font-size: 15px; color: var(--muted); margin: 0 0 32px; max-width: 400px; line-height: 1.6; }
.hero-suggestions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  max-width: 480px;
}
.hero-suggestion {
  padding: 10px 18px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--brand-soft);
  color: var(--brand);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}
.hero-suggestion:hover { background: #dce8ff; transform: translateY(-1px); }

/* ===== Chat Topbar ===== */
.chat-topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
  gap: 12px;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.topbar-icon { font-size: 24px; }
.topbar-title { font-size: 16px; font-weight: 600; }
.topbar-badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
.session-pill { font-size: 11px; color: var(--muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.button {
  border: 0; border-radius: 999px; padding: 8px 14px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: transform 120ms ease, opacity 120ms ease;
}
.button:hover { transform: translateY(-1px); }
.button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.button-secondary { background: #e7dfd0; color: var(--ink); }
.button-primary { background: var(--brand); color: #fff; }
.button-outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.new-session-btn { font-size: 12px; padding: 6px 12px; }

/* ===== Messages ===== */
.chat-messages-wrap {
  display: none;
  flex: 1;
  overflow-y: auto;
}
.messages {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
}
.message { display: flex; flex-direction: column; gap: 4px; max-width: 92%; }
.message-user { align-self: flex-end; }
.message-agent, .message-system { align-self: flex-start; }
.message-label { font-size: 11px; color: var(--muted); }
.message-bubble {
  border-radius: 18px; padding: 12px 16px;
  font-size: 14px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word;
}
.message-user .message-bubble { background: var(--user); color: #fff; border-bottom-right-radius: 6px; }
.message-agent .message-bubble { background: var(--agent-bg); border: 1px solid #e7dfd0; border-bottom-left-radius: 6px; }
.message-system .message-bubble { background: var(--accent-soft); color: #6e3a20; border-bottom-left-radius: 6px; }

/* ===== Agent Inline Cards ===== */
.agent-inline-card {
  align-self: flex-start;
  width: 100%;
  max-width: 720px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 18px;
  box-shadow: var(--shadow);
  margin-top: 4px;
}
.card-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.card-pill {
  padding: 4px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  background: var(--brand-soft); color: var(--brand);
}
.card-title-text { font-size: 14px; font-weight: 600; }
.card-field-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.card-field { display: flex; flex-direction: column; gap: 4px; }
.card-field-label { font-size: 12px; color: var(--muted); }
.card-field select,
.card-field input,
.card-field textarea {
  width: 100%; padding: 10px 12px;
  border: 1px solid #cfdbf1; border-radius: 14px;
  font: inherit; font-size: 13px;
  background: #fbfdff; color: var(--ink);
  transition: border-color 0.2s;
}
.card-field select:focus,
.card-field input:focus,
.card-field textarea:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(36,107,255,0.1);
}
.card-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.card-candidates { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.candidate-item {
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px;
  cursor: pointer; transition: border-color 0.2s, background 0.2s;
  display: flex; justify-content: space-between; align-items: center;
}
.candidate-item:hover { border-color: var(--brand); background: var(--brand-soft); }
.candidate-name { font-size: 13px; font-weight: 600; }
.candidate-meta { font-size: 12px; color: var(--muted); }
.candidate-select-btn { padding: 6px 12px; font-size: 12px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); border: 0; cursor: pointer; font-weight: 600; }
.candidate-select-btn:hover { background: var(--brand); color: #fff; }

/* Quick Fill (inline card variant) */
.quick-fill-card { }
.quick-fill-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}
.quick-fill-field { display: flex; flex-direction: column; gap: 4px; }
.quick-fill-label { font-size: 12px; color: var(--muted); }
.quick-fill-field select,
.quick-fill-field input {
  width: 100%; padding: 10px 12px;
  border: 1px solid #cfdbf1; border-radius: 14px;
  font: inherit; font-size: 13px;
  background: #fbfdff; color: var(--ink);
}

/* Address panel */
.address-message { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.address-candidate { padding: 12px 0; border-bottom: 1px solid var(--line); }
.address-candidate-name { font-size: 13px; font-weight: 600; margin: 0 0 4px; }
.address-candidate-text { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
.address-manual { display: flex; gap: 10px; align-items: center; margin: 12px 0; }
.address-manual input {
  flex: 1; padding: 10px 12px;
  border: 1px solid #cfdbf1; border-radius: 14px;
  font: inherit; font-size: 13px;
}

/* ===== Voice Bar (bottom) ===== */
.voice-bar {
  flex-shrink: 0;
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
  background: #fff;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.voice-bar-row {
  display: flex; align-items: center; gap: 10px;
  width: 100%; max-width: 800px;
}
.voice-bar-input {
  flex: 1; display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: #f7f9fc;
  border: 1px solid var(--line); border-radius: 24px;
}
.voice-bar-input textarea {
  flex: 1; border: 0; outline: none; background: transparent;
  font: inherit; font-size: 14px; color: var(--ink);
  resize: none; min-height: 22px; max-height: 120px;
  line-height: 1.5; padding: 0;
  align-self: center;
}
.voice-bar-input textarea::placeholder { color: #aab5c0; }
.voice-main-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: 0; background: var(--brand); color: #fff;
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.voice-main-btn.recording { background: #e53e3e; animation: pulse 1.5s infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(229,62,62,0.4); }
  50% { box-shadow: 0 0 0 12px rgba(229,62,62,0); }
}
.voice-status { font-size: 11px; color: var(--muted); text-align: center; }
.voice-toggle-btn {
  border: 0; background: transparent; color: var(--muted);
  font-size: 13px; cursor: pointer; padding: 4px 8px;
}

/* ===== chat-active state ===== */
body.chat-active .welcome-hero { display: none; }
body.chat-active .chat-topbar { display: flex; }
body.chat-active .chat-messages-wrap { display: block; }

/* Side info cards (compact, in messages) */
.side-info { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.side-card { padding: 8px 14px; border-radius: 12px; background: #f0f4ff; font-size: 12px; color: var(--ink); }
.side-card strong { color: var(--brand); }

/* ===== Phone Shell Appearance ===== */
.phone-shell {
  animation: phoneRise 0.5s ease-out;
}
@keyframes phoneRise {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Responsive ===== */
@media (max-width: 440px) {
  body { padding: 0; align-items: stretch; }
  .phone-shell {
    width: 100%;
    height: 100vh;
    border-radius: 0;
    border: 0;
    box-shadow: none;
  }
  .phone-shell::before { display: none; }
  .messages { padding: 12px; }
  .agent-inline-card { border-radius: 18px; padding: 14px; }
  .card-field-list, .quick-fill-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <div class="phone-shell">
    <!-- Welcome Hero -->
    <div class="welcome-hero">
    <div class="welcome-hero-icon">🤖</div>
    <h1 class="welcome-hero-title">经销商资料录入助手</h1>
    <p class="welcome-hero-subtitle">你来说，我来整理。支持语音输入，自动识别主体信息、联系人、地址并完成创建前校验。</p>
    <div class="hero-suggestions">
      <button class="hero-suggestion" data-text="新增经销商，经销商叫上海契胜科技有限公司，主营类目是汽车用品">新增经销商示例</button>
      <button class="hero-suggestion" data-text="帮我录一个经销商，浙江博远汽车销售服务有限公司，门店在杭州市拱墅区石祥路333号">含地址示例</button>
      <button class="hero-suggestion" data-text="补充经销商联系人信息">补充联系人</button>
    </div>
  </div>

  <!-- Chat Topbar (hidden initially) -->
  <div class="chat-topbar" id="chatTopbar">
    <div class="topbar-left">
      <span class="topbar-icon">🤖</span>
      <span class="topbar-title">经销商资料录入</span>
      <span class="topbar-badge" id="stagePill">录入中</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="session-pill" id="sessionPill"></span>
      <button class="button button-outline new-session-btn" id="newSessionButton">新建会话</button>
    </div>
  </div>

  <!-- Messages wrap -->
  <div class="chat-messages-wrap">
    <div class="messages" id="messages"></div>
  </div>

  <!-- Voice Bar -->
  <div class="voice-bar">
    <div class="voice-bar-row">
      <div class="voice-bar-input">
        <textarea id="messageInput" placeholder="输入消息，或点击麦克风语音输入..." rows="1" autofocus></textarea>
        <button class="button button-primary" id="sendButton">发送</button>
      </div>
      <button class="voice-main-btn" id="micButton" title="开始/停止录音">🎤</button>
    </div>
    <div class="voice-status" id="voiceStatus">语音未启动</div>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="voice-toggle-btn" id="newSessionBtn2">🔄 新会话</button>
    </div>
  </div>
  </div><!-- .phone-shell -->
</body>

<script>
(function() {
  // ===== State =====
  let sessionId = "";
  let sending = false;
  let currentMissingFields = [];
  let quickFillDraft = {};
  let fieldOptions = {};
  let currentAddressConfirmation = null;

  // ASR
  let recording = false;
  let awaitingAsrFinish = false;
  let asrSocket = null;
  let asrStream = null;
  let asrAudioContext = null;
  let asrSourceNode = null;
  let asrProcessorNode = null;
  let asrInputPrefix = "";
  let asrTranscript = "";
  let asrPreview = "";

  // ===== DOM refs =====
  const messages = document.getElementById("messages");
  const messageInput = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const micButton = document.getElementById("micButton");
  const voiceStatus = document.getElementById("voiceStatus");
  const sessionPill = document.getElementById("sessionPill");
  const stagePill = document.getElementById("stagePill");
  const newSessionButton = document.getElementById("newSessionButton");
  const newSessionBtn2 = document.getElementById("newSessionBtn2");
  const chatTopbar = document.getElementById("chatTopbar");

  // ===== Sessions =====
  function makeSessionId() {
    if (window.crypto && window.crypto.randomUUID) return "web-" + window.crypto.randomUUID();
    return "web-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function resetSession() {
    sessionId = makeSessionId();
    sessionPill.textContent = "会话: " + sessionId.slice(0, 18) + "...";
    messages.innerHTML = "";
    currentMissingFields = [];
    quickFillDraft = {};
    currentAddressConfirmation = null;
    messageInput.value = "";
    messageInput.style.height = "auto";
    asrInputPrefix = "";
    asrTranscript = "";
    asrPreview = "";
    stagePill.textContent = "录入中";
    document.body.classList.remove("chat-active");
    setVoiceStatus("语音未启动");
    messageInput.focus();
  }

  // ===== Messages =====
  function appendMessage(role, text) {
    const wrapper = document.createElement("div");
    wrapper.className = "message message-" + role;
    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent = role === "user" ? "你" : role === "agent" ? "助手" : "系统";
    const bubble = document.createElement("div");
    bubble.className = "message-bubble";
    bubble.textContent = text;
    wrapper.appendChild(label);
    wrapper.appendChild(bubble);
    messages.appendChild(wrapper);
    messages.parentElement.scrollTop = messages.parentElement.scrollHeight;
  }

  function enterChatMode() {
    document.body.classList.add("chat-active");
  }

  // ===== Inline Cards =====
  function appendCard(cardEl) {
    messages.appendChild(cardEl);
    messages.parentElement.scrollTop = messages.parentElement.scrollHeight;
  }

  function removeOldCards() {
    messages.querySelectorAll(".agent-inline-card").forEach(function(c) { c.remove(); });
  }

  function renderEnumCard(fields) {
    if (!fields || fields.length === 0) return;
    var enumFields = fields.filter(function(f) { return fieldOptions[f]; });
    var textFields = fields.filter(function(f) { return !fieldOptions[f]; });
    if (enumFields.length === 0 && textFields.length === 0) return;

    var card = document.createElement("div");
    card.className = "agent-inline-card quick-fill-card";
    card.id = "enumCard";

    var header = document.createElement("div");
    header.className = "card-header";
    var pill = document.createElement("span");
    pill.className = "card-pill"; pill.textContent = "待补充";
    var title = document.createElement("span");
    title.className = "card-title-text"; title.textContent = "枚举字段补充";
    header.appendChild(pill);
    header.appendChild(title);
    card.appendChild(header);

    var grid = document.createElement("div");
    grid.className = "quick-fill-grid";

    Object.keys(quickFillDraft).forEach(function(k) {
      if (enumFields.indexOf(k) === -1) delete quickFillDraft[k];
    });

    enumFields.forEach(function(fieldPath) {
      var config = fieldOptions[fieldPath];
      if (!config) return;
      var fieldDiv = document.createElement("div");
      fieldDiv.className = "quick-fill-field";
      var lbl = document.createElement("label");
      lbl.className = "quick-fill-label";
      lbl.textContent = config.label;
      var sel = document.createElement("select");
      var ph = document.createElement("option"); ph.value = ""; ph.textContent = "请选择" + config.label;
      sel.appendChild(ph);
      config.options.forEach(function(opt) {
        var o = document.createElement("option");
        o.value = JSON.stringify(opt.value);
        o.textContent = opt.label;
        sel.appendChild(o);
      });
      if (Object.prototype.hasOwnProperty.call(quickFillDraft, fieldPath)) {
        sel.value = JSON.stringify(quickFillDraft[fieldPath]);
      }
      sel.addEventListener("change", function(evt) {
        var v = evt.target.value;
        if (!v) { delete quickFillDraft[fieldPath]; return; }
        quickFillDraft[fieldPath] = JSON.parse(v);
      });
      fieldDiv.appendChild(lbl); fieldDiv.appendChild(sel);
      grid.appendChild(fieldDiv);
    });
    card.appendChild(grid);

    // Text input fields (no enum options, e.g. contactName, mobile)
    if (textFields.length > 0) {
      var textGrid = document.createElement("div");
      textGrid.className = "quick-fill-grid";
      textFields.forEach(function(fieldPath) {
        var labelText = fieldPath;
        var parts = fieldPath.split(".");
        if (parts.length >= 2) {
          var fieldName = parts[parts.length - 1];
          var labels = {contactName:"联系人姓名",mobile:"联系电话",wechat:"微信号",remark:"备注",position:"职位",contactName2:"第二联系人姓名",mobile2:"第二联系人电话"};
          labelText = labels[fieldName] || fieldName;
        }
        var fieldDiv = document.createElement("div");
        fieldDiv.className = "quick-fill-field";
        var lbl = document.createElement("label");
        lbl.className = "quick-fill-label";
        lbl.textContent = labelText;
        var inp = document.createElement("input");
        inp.type = "text";
        inp.placeholder = "请输入" + labelText;
        inp.value = quickFillDraft[fieldPath] || "";
        inp.addEventListener("input", function() {
          var v = inp.value.trim();
          if (!v) { delete quickFillDraft[fieldPath]; return; }
          quickFillDraft[fieldPath] = v;
        });
        fieldDiv.appendChild(lbl); fieldDiv.appendChild(inp);
        textGrid.appendChild(fieldDiv);
      });
      card.appendChild(textGrid);
    }

    var actions = document.createElement("div");
    actions.className = "card-actions";
    var btn = document.createElement("button");
    btn.className = "button button-primary";
    btn.textContent = "确认这些字段";
    btn.addEventListener("click", sendStructuredFields);
    var skip = document.createElement("button");
    skip.className = "button button-outline";
    skip.textContent = "跳过";
    skip.addEventListener("click", function() {
      removeOldCards();
      quickFillDraft = {};
    });
    actions.appendChild(btn); actions.appendChild(skip);
    card.appendChild(actions);
    appendCard(card);
  }

  // Build structured patch from quickFillDraft
  function setPathValue(target, fieldPath, value) {
    var parts = fieldPath.split(".", 2);
    var section = parts[0], fieldName = parts[1];
    if (!section || !fieldName) return;
    var m = section.match(/^([a-zA-Z_]+)\[(\d+)\]$/);
    if (m) {
      var listName = m[1], idx = Number(m[2]);
      if (!target[listName]) target[listName] = [];
      if (!target[listName][idx]) target[listName][idx] = {};
      target[listName][idx][fieldName] = value;
    } else {
      if (!target[section]) target[section] = {};
      target[section][fieldName] = value;
    }
  }

  function buildStructuredPatch() {
    var patch = {};
    Object.entries(quickFillDraft).forEach(function(e) { setPathValue(patch, e[0], e[1]); });
    return patch;
  }

  function buildStructuredPreview(patch) {
    var segs = [];
    Object.entries(patch.main_info || {}).forEach(function(e) {
      var config = fieldOptions["main_info." + e[0]];
      if (!config) return;
      var opt = config.options.find(function(o) { return o.value === e[1]; });
      segs.push(config.label + "=" + (opt ? opt.label : String(e[1])));
    });
    (patch.contacts || []).forEach(function(contact, idx) {
      Object.entries(contact).forEach(function(e) {
        var config = fieldOptions["contacts[" + idx + "]." + e[0]] || fieldOptions["contacts[0]." + e[0]];
        if (!config) return;
        var opt = config.options.find(function(o) { return o.value === e[1]; });
        segs.push(config.label + "=" + (opt ? opt.label : String(e[1])));
      });
    });
    return segs.join("，");
  }

  // Address card
  function renderCompanyCard(companyFlow) {
    if (!companyFlow) return;
    // 只有 active 且 last_response 有 need_select 时才渲染
    if (companyFlow.status !== "active" && companyFlow.status !== "selecting") return;
    var resp = companyFlow.last_response;
    if (!resp || !resp.candidates || resp.candidates.length === 0) return;

    var card = document.createElement("div");
    card.className = "agent-inline-card";

  async function sendMessage(rawText) {
    rawText = (rawText !== undefined) ? rawText : messageInput.value;
    var text = (rawText || "").trim();
    if (!text || sending || recording || awaitingAsrFinish) return;
    setSending(true);
    enterChatMode();
    appendMessage("user", text);
    messageInput.value = "";
    try {
      var resp = await fetch("/api/agent/distributors/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId, message: text})
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status + ": " + await resp.text());
      var payload = await resp.json();
      appendMessage("agent", payload.reply || "接口返回为空");
      stagePill.textContent = payload.stage || "录入中";
      renderAllCards(payload);
    } catch(e) {
      appendMessage("system", "请求失败：" + e.message);
    } finally {
      setSending(false);
      messageInput.focus();
    }
  }

  async function sendStructuredFields() {
    if (sending || recording || awaitingAsrFinish) return;
    var patch = buildStructuredPatch();

    var hasContacts = Array.isArray(patch.contacts) && patch.contacts.some(function(c) { return c && Object.keys(c).length > 0; });
    if (!hasMain && !hasContacts) { appendMessage("system", "请先选择至少一个标准字段。"); return; }
    setSending(true);
    appendMessage("user", "结构化补充：" + buildStructuredPreview(patch));
    try {

        method: "PATCH", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId, patch: patch})
      });

      var payload = await resp.json();
      quickFillDraft = {};
      appendMessage("agent", payload.reply || "接口返回为空");
      stagePill.textContent = payload.stage || "录入中";
      removeOldCards();
      renderAllCards(payload);

    } finally { setSending(false); messageInput.focus(); }

    navigator.geolocation.getCurrentPosition(async function(pos) {

          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            session_id: sessionId,

              suggested_reply: "已使用当前位置。",
              candidates: [],
              resolved_address: {
                full_address: pos.coords.latitude + "," + pos.coords.longitude,
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                geo_source: "gps",
                confidence: "low"
              },
              state: {"phase":"idle","candidates":[],"current_coordinates":null,"admin_hints":null,"pending_location_detail":null}
            }
          })
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        var payload = await resp.json();
        appendMessage("agent", payload.reply || "GPS位置已确认");

        body: JSON.stringify({
          session_id: sessionId,

            resolved_address: null,

  function cnNumToArabic(text) {
    var singleMap = {"零":0,"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"幺":1,"两":2,"〇":0};
    // 连续3位以上中文数字 → 阿拉伯数字
    text = text.replace(/[零一二三四五六七八九幺两〇]{3,}/g, function(m) {
      var r = "";
      for (var i = 0; i < m.length; i++) { var d = singleMap[m[i]]; r += (d !== undefined ? d : m[i]); }
      return r;
    });
    // 语音识别口语 → 符号（仅在数字/字母上下文中的"点"转为"."）
    text = text.split("艾特").join("@");
    text = text.replace(/(\d)点(\w)/g, "$1.$2");
    text = text.replace(/(\w)点(\d)/g, "$1.$2");
    return text;
  }

  function composeAsrDraft() {
    var block = (asrTranscript + asrPreview).trim();
    block = cnNumToArabic(block);
    if (!asrInputPrefix) return block;
    if (!block) return asrInputPrefix;
    return asrInputPrefix + "\n" + block;
  }

  function autoResizeTextarea() {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + "px";
  }

  function refreshAsrDraft() { messageInput.value = composeAsrDraft(); autoResizeTextarea(); }

  function cleanupRecordingResources() {
    if (asrProcessorNode) { asrProcessorNode.disconnect(); asrProcessorNode.onaudioprocess = null; asrProcessorNode = null; }
    if (asrSourceNode) { asrSourceNode.disconnect(); asrSourceNode = null; }
    if (asrStream) { asrStream.getTracks().forEach(function(t) { t.stop(); }); asrStream = null; }
    if (asrAudioContext) { asrAudioContext.close(); asrAudioContext = null; }
  }

  function finishRecording(statusText) {
    if (!recording && !awaitingAsrFinish && !asrSocket) return;
    cleanupRecordingResources();
    recording = false;
    awaitingAsrFinish = false;
    if (asrSocket) { asrSocket.close(); }
    asrSocket = null;
    updateControls();
    setVoiceStatus(statusText);
  }

  async function startMicrophoneStreaming() {
    var AudioCtx = window.AudioContext || window.webkitAudioContext;
    asrAudioContext = new AudioCtx();
    await asrAudioContext.resume();
    asrSourceNode = asrAudioContext.createMediaStreamSource(asrStream);
    var bufferSize = 4096;
    asrProcessorNode = asrAudioContext.createScriptProcessor(bufferSize, 1, 1);
    asrProcessorNode.onaudioprocess = function(evt) {
      if (!asrSocket || asrSocket.readyState !== WebSocket.OPEN || awaitingAsrFinish) return;
      var input = evt.inputBuffer.getChannelData(0);
      var pcm16 = float32ToPcm16(input);
      var downsampled = downsampleTo16kHz(pcm16, asrAudioContext.sampleRate);
      var buf = new ArrayBuffer(downsampled.length * 2);
      var view = new DataView(buf);
      downsampled.forEach(function(v, i) { view.setInt16(i * 2, v, true); });
      asrSocket.send(buf);
    };
    asrSourceNode.connect(asrProcessorNode);
    asrProcessorNode.connect(asrAudioContext.destination);
  }

  function downsampleTo16kHz(buf, inputRate) {
    if (inputRate <= 16000) return buf;
    var ratio = inputRate / 16000;
    var outLen = Math.floor(buf.length / ratio);
    var out = new Int16Array(outLen);
    for (var i = 0; i < outLen; i++) {
      var srcIdx = Math.floor(i * ratio);
      out[i] = buf[srcIdx];
    }
    return out;
  }

  function float32ToPcm16(buf) {
    var out = new Int16Array(buf.length);
    for (var i = 0; i < buf.length; i++) {
      var s = Math.max(-1, Math.min(1, buf[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    return out;
  }

  async function startRecording() {
    if (sending || recording || awaitingAsrFinish) { return; }
    if (!window.isSecureContext) {
      throw makeVoiceUiError(
        "当前页面不支持语音输入",
        "当前页面不是安全上下文，语音输入需要在 HTTPS 或 localhost 下使用。请使用 HTTPS 或 localhost 打开页面。"
      );
    }
    if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function") {
      throw makeVoiceUiError(
        "浏览器不支持麦克风",
        "当前浏览器不支持麦克风采集，请改用最新版 Chrome 或 Safari，并确认页面运行在 HTTPS 或 localhost。"
      );
    }
    try {
      setVoiceStatus("正在请求麦克风权限...");
      asrStream = await navigator.mediaDevices.getUserMedia({audio: true});
    } catch(e) {
      throw makeVoiceUiError("麦克风权限失败", "无法开始录音：" + e.message, e.message);
    }
    asrInputPrefix = messageInput.value.trim();
    asrTranscript = "";
    asrPreview = "";
    recording = true;
    awaitingAsrFinish = false;
    updateControls();
    setVoiceStatus("正在连接实时语音识别...");
    asrSocket = new WebSocket(buildAsrWebSocketUrl());
    asrSocket.binaryType = "arraybuffer";
    asrSocket.addEventListener("open", function() {
      asrSocket.send(JSON.stringify({type: "start"}));
    });
    asrSocket.addEventListener("message", async function(evt) {
      var payload = JSON.parse(evt.data);
      if (payload.type === "starting") { setVoiceStatus("语音识别会话初始化中..."); return; }
      if (payload.type === "ready") { setVoiceStatus("录音中，文字将实时回填输入框"); await startMicrophoneStreaming(); return; }
      if (payload.type === "partial") { asrTranscript = payload.text || ""; asrPreview = payload.stash || ""; refreshAsrDraft(); return; }
      if (payload.type === "final") { asrTranscript = payload.text || ""; asrPreview = ""; refreshAsrDraft(); return; }
      if (payload.type === "finished") { finishRecording("识别完成，请检查后发送"); return; }
      if (payload.type === "error") {
        enterChatMode();
        appendMessage("system", "语音识别失败：" + (payload.message || "未知错误"));
        finishRecording("语音识别失败");
      }
    });
    asrSocket.addEventListener("close", function() {
      if (recording || awaitingAsrFinish) finishRecording("语音会话已关闭");
    });
    asrSocket.addEventListener("error", function() {
      enterChatMode();
      appendMessage("system", "实时语音识别连接异常。");
      finishRecording("语音识别连接异常");
    });
  }

  function stopRecording() {
    if (!recording || awaitingAsrFinish || !asrSocket || asrSocket.readyState !== WebSocket.OPEN) return;
    awaitingAsrFinish = true;
    updateControls();
    setVoiceStatus("正在结束语音识别...");
    cleanupRecordingResources();
    asrSocket.send(JSON.stringify({type: "stop"}));
  }

  // ===== Event listeners =====
  sendButton.addEventListener("click", function() { sendMessage(); });
  messageInput.addEventListener("keydown", function(evt) {
    if (evt.key === "Enter" && !evt.shiftKey) { evt.preventDefault(); sendMessage(); }
  });
  messageInput.addEventListener("input", autoResizeTextarea);

  micButton.addEventListener("click", function() {
    if (recording) { stopRecording(); return; }
    startRecording().catch(function(e) {
      if (e && e.voiceUiHandled) { return; }
      setVoiceStatus("录音启动失败");
      enterChatMode();
      appendMessage("system", "录音失败：" + e.message);
    });
  });

  newSessionButton.addEventListener("click", resetSession);
  newSessionBtn2.addEventListener("click", resetSession);

  document.querySelectorAll(".hero-suggestion").forEach(function(btn) {
    btn.addEventListener("click", function() {
      sendMessage(btn.getAttribute("data-text"));
    });
  });

  // Init
  resetSession();
  updateControls();
  loadFieldOptions();
})();
</script>
</html>
